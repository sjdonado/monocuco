<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#fbfcfe" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#13161a" />
    <link
      rel="preload"
      href="/fonts/inter-latin-var.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link rel="icon" href="/favicon.ico" />

    <meta property="og:title" content="Monocuco" />
    <meta property="og:type" content="website" />

    <meta property="og:image" content="https://monocuco.sjdonado.com/logo512.png" />
    <meta property="og:image:width" content="512" />
    <meta property="og:image:height" content="512" />

    <meta property="og:site_name" content="Monocuco" />
    <meta
      property="og:description"
      content="Diccionario abierto y gratuito de español barranquillero: palabras y expresiones de Barranquilla con su definición y ejemplos."
    />

    <link rel="apple-touch-icon" href="/logo192.png" />
    <link rel="manifest" href="/manifest.json" />

    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
